<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEP PICTURES</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #060709;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Первый пустой экран со стрелочкой вниз */
        .hero-spacer {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
        }

        .scroll-hint {
            font-size: 12px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(-10px); opacity: 0.8; }
        }

        /* Секция с кнопкой-карточкой */
        .card-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* Неоновые пятна на фоне в стиле референса */
        .bg-glows {
            position: absolute;
            width: 100%;
            max-width: 420px;
            height: 450px;
            pointer-events: none;
            z-index: 1;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
        }

        .glow-blue {
            width: 240px;
            height: 240px;
            background: #0066ff;
            top: 5%;
            left: 0;
        }

        .glow-green {
            width: 220px;
            height: 220px;
            background: #00ff87;
            bottom: 5%;
            right: 0;
        }

        /* Прозрачная стеклянная карточка-кнопка (Glassmorphism) */
        .glass-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 380px;
            padding: 48px 32px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 36px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-decoration: none;
            color: #ffffff;
            text-align: center;
            display: block;
            cursor: pointer;
            will-change: transform, opacity;
            
            /* Начальное состояние (маленькая и прозрачная) */
            transform: scale(0.6) translateY(60px);
            opacity: 0;
            transition: transform 0.1s linear, opacity 0.1s linear, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 30px 70px rgba(0, 210, 255, 0.25),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .card-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .card-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 36px;
            letter-spacing: 1px;
        }

        .btn-action {
            display: inline-block;
            padding: 14px 32px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .glass-card:hover .btn-action {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Секция для пролистывания -->
    <div class="hero-spacer">
        <div class="scroll-hint">Пролистайте вниз ↓</div>
    </div>

    <!-- Секция с кнопкой -->
    <div class="card-section">
        <div class="bg-glows">
            <div class="glow glow-blue"></div>
            <div class="glow glow-green"></div>
        </div>

        <a href="https://t.me/deep_PICTURES_color" target="_blank" class="glass-card" id="mainCard">
            <div class="card-title">DEEP PICTURES</div>
            <div class="card-subtitle">Color Grading & Visual Arts</div>
            <div class="btn-action">Перейти в канал →</div>
        </a>
    </div>

    <!-- Анимация увеличения при скролле -->
    <script>
        window.addEventListener('scroll', () => {
            const card = document.getElementById('mainCard');
            const rect = card.getBoundingClientRect();
            const windowHeight = window.innerHeight;

            // Расчет прогресса скролла (от 0 до 1)
            let progress = (windowHeight - rect.top) / (windowHeight * 0.7);
            progress = Math.min(Math.max(progress, 0), 1);

            // Масштабирование от 0.6 до 1.0 и проявление прозрачности
            const scale = 0.6 + (0.4 * progress);
            const opacity = progress;
            const translateY = (1 - progress) * 60;

            card.style.transform = scale(${scale}) translateY(${translateY}px);
            card.style.opacity = opacity;
        });
    </script>
</body>
</html>
