<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEP PICTURES</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 1. Первый экран с логотипом */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            background-color: #000000;
        }

        .hero-logo {
            max-width: 85%;
            width: 420px;
            height: auto;
            object-fit: contain;
        }

        .scroll-hint {
            position: absolute;
            bottom: 35px;
            font-size: 12px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(-8px); opacity: 0.7; }
        }

        /* 2. Второй экран с прозрачной стеклянной кнопкой */
        .card-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #000000;
        }

        /* Матовое прозрачное стекло */
        .glass-card {
            width: 100%;
            max-width: 380px;
            padding: 42px 28px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-decoration: none;
            color: #ffffff;
            text-align: center;
            display: block;
            cursor: pointer;
            will-change: transform, opacity;

            /* Начальное состояние (маленькая и сдвинутая вниз) */
            transform: scale(0.6) translateY(50px);
            opacity: 0;
            transition: transform 0.1s linear, opacity 0.1s linear, border-color 0.3s ease, background 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .card-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .btn-action {
            display: inline-block;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .glass-card:hover .btn-action {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Первый экран: Логотип -->
    <div class="hero-section">
        <img src="logo.jpg" alt="CTZCREW" class="hero-logo">
        <div class="scroll-hint">Пролистайте вниз ↓</div>
    </div>

    <!-- Второй экран: Прозрачная кнопка-ссылка -->
    <div class="card-section">
        <a href="https://t.me/deep_PICTURES_color" target="_blank" class="glass-card" id="mainCard">
            <div class="card-title">DEEP PICTURES</div>
            <div class="card-subtitle">Telegram Channel</div>
            <div class="btn-action">Перейти в канал →</div>
        </a>
    </div>

    <!-- Скрипт плавного расширения карточки при скролле -->
    <script>
        window.addEventListener('scroll', () => {
            const card = document.getElementById('mainCard');
            const rect = card.getBoundingClientRect();
            const windowHeight = window.innerHeight;

            let progress = (windowHeight - rect.top) / (windowHeight * 0.7);
            progress = Math.min(Math.max(progress, 0), 1);

            const scale = 0.6 + (0.4 * progress);
            const opacity = progress;
            const translateY = (1 - progress) * 50;

            card.style.transform = `scale(${scale}) translateY(${translateY}px)`;
            card.style.opacity = opacity;
        });
    </script>
</body>
</html>
