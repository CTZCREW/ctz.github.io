<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEP PICTURES & CTZCREW</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated glowing gradient waves along left & right edges */
        .side-wave {
            position: fixed;
            top: -20%;
            width: 220px;
            height: 140%;
            pointer-events: none;
            z-index: 1;
            filter: blur(70px);
            opacity: 0.75;
            will-change: transform, opacity;
        }

        .wave-left {
            left: -100px;
            background: linear-gradient(
                180deg, 
                #00f2fe 0%, 
                #4facfe 25%, 
                #7f00ff 60%, 
                #00f2fe 100%
            );
            background-size: 100% 200%;
            animation: waveFlowLeft 10s ease-in-out infinite alternate, gradientShift 14s ease infinite;
        }

        .wave-right {
            right: -100px;
            background: linear-gradient(
                180deg, 
                #7f00ff 0%, 
                #a29bfe 30%, 
                #00f2fe 70%, 
                #7f00ff 100%
            );
            background-size: 100% 200%;
            animation: waveFlowRight 10s ease-in-out infinite alternate, gradientShift 14s ease infinite;
        }

        @keyframes waveFlowLeft {
            0% { transform: translateY(-8%) scaleX(0.85); opacity: 0.6; }
            50% { transform: translateY(8%) scaleX(1.35); opacity: 0.85; }
            100% { transform: translateY(-4%) scaleX(0.95); opacity: 0.65; }
        }

        @keyframes waveFlowRight {
            0% { transform: translateY(8%) scaleX(1.3); opacity: 0.85; }
            50% { transform: translateY(-8%) scaleX(0.85); opacity: 0.55; }
            100% { transform: translateY(4%) scaleX(1.2); opacity: 0.8; }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 0%; }
            50% { background-position: 0% 100%; }
            100% { background-position: 0% 0%; }
        }

        /* Hero Section - First screen */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            z-index: 2;
            background: transparent; /* Must stay transparent so side glows pass through */
        }

        .hero-logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .hero-logo {
            max-width: 90%;
            width: 380px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.8));
        }

        /* Elevated Arrow Styling */
        .scroll-arrow-wrap {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            text-decoration: none;
        }

        /* Hero arrow elevated high up as requested (160px from bottom) */
        .hero-section .scroll-arrow-wrap {
            bottom: 160px;
        }

        .scroll-arrow-icon {
            width: 28px;
            height: 28px;
            stroke: #ffffff;
            stroke-width: 1.8;
            filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.6));
            animation: bounceArrow 2s ease-in-out infinite;
        }

        @keyframes bounceArrow {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-12px); opacity: 1; }
        }

        /* Main Cards Container */
        .cards-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            background: transparent;
            padding-bottom: 60px;
        }

        .card-section {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            position: relative;
            background: transparent;
        }

        /* Second Arrow elevated under Card 1 (80px from bottom) */
        .card-section .scroll-arrow-wrap {
            bottom: 80px;
        }

        /* Glassmorphism translucent card */
        .glass-card {
            width: 100%;
            max-width: 380px;
            padding: 44px 30px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85),
                        inset 0 1px 1px rgba(255, 255, 255, 0.25);
            text-decoration: none;
            color: #ffffff;
            text-align: center;
            display: block;
            cursor: pointer;
            will-change: transform, opacity;

            /* Initial state before scroll animation */
            transform: scale(0.65) translateY(50px);
            opacity: 0;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        opacity 0.15s linear, 
                        border-color 0.3s ease, 
                        background 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 30px 70px rgba(0, 242, 254, 0.18),
                        inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .card-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #d1d5db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .btn-action {
            display: inline-block;
            padding: 13px 32px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .glass-card:hover .btn-action {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="side-wave wave-left"></div>
    <div class="side-wave wave-right"></div>

    <!-- Hero Section -->
    <div class="hero-section" id="hero">
        <div class="hero-logo-wrapper">
            <!-- Image with inline SVG fallback if logo.jpg fails to load -->
            <img src="logo.jpg" alt="CTZCREW" class="hero-logo" 
                 onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 500 120\'><text x=\'50%\' y=\'65%\' font-family=\'sans-serif\' font-weight=\'900\' font-size=\'55\' fill=\'%23ffffff\' text-anchor=\'middle\' letter-spacing=\'4\'>CTZCREW</text></svg>';">
        </div>

        <!-- First elevated arrow (160px from bottom) -->
        <a href="#card1" class="scroll-arrow-wrap" aria-label="Scroll down">
            <svg class="scroll-arrow-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4V20M12 20L6 14M12 20L18 14" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
    </div>

    <!-- Link Cards Container -->
    <div class="cards-container">
        
        <!-- Card 1: DEEP PICTURES -->
        <div class="card-section" id="card1">
            <a href="https://t.me/deep_PICTURES_color" target="_blank" class="glass-card">
                <div class="card-title">DEEP PICTURES</div>
                <div class="card-subtitle">Color Grading Channel</div>
                <div class="btn-action">Перейти в канал →</div>
            </a>

            <!-- Second elevated arrow (80px from bottom) -->
            <a href="#card2" class="scroll-arrow-wrap" aria-label="Scroll to next channel">
                <svg class="scroll-arrow-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V20M12 20L6 14M12 20L18 14" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </div>

        <!-- Card 2: CTZCREW -->
        <div class="card-section" id="card2">
            <a href="https://t.me/ctzcrew" target="_blank" class="glass-card">
                <div class="card-title">CTZCREW</div>
                <div class="card-subtitle">Official Channel</div>
                <div class="btn-action">Перейти в канал →</div>
            </a>
        </div>

    </div>

    <script>
        function handleScrollAnimations() {
            const cards = document.querySelectorAll('.glass-card');
            const windowHeight = window.innerHeight;

            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                
                // Calculate scroll progress relative to viewport position
                let progress = (windowHeight - rect.top) / (windowHeight * 0.65);
                progress = Math.min(Math.max(progress, 0), 1);

                // Scale smoothly from 0.65 to 1.0, fade opacity from 0 to 1
                const scale = 0.65 + (0.35 * progress);
                const opacity = progress;
                const translateY = (1 - progress) * 50;

                card.style.transform = `scale(${scale}) translateY(${translateY}px)`;
                card.style.opacity = opacity;
            });
        }

        // Trigger on scroll and on initial load
        window.addEventListener('scroll', handleScrollAnimations, { passive: true });
        window.addEventListener('DOMContentLoaded', handleScrollAnimations);
        handleScrollAnimations();
    </script>
</body>
</html>
