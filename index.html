<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEP PICTURES & CTZCREW</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Боковые анимированные градиентные волны (Стиль для ПК) --- */
        .glow-side {
            position: fixed;
            top: -10%;
            width: 100px;
            height: 120%;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            opacity: 0.5;
        }

        .glow-left {
            left: -50px;
            background: linear-gradient(180deg, #5ce1e6 0%, #a29bfe 50%, #6c5ce7 100%);
            animation: waveLeft 9s ease-in-out infinite alternate;
        }

        .glow-right {
            right: -50px;
            background: linear-gradient(180deg, #a29bfe 0%, #5ce1e6 50%, #8c7ae6 100%);
            animation: waveRight 9s ease-in-out infinite alternate;
        }

        @keyframes waveLeft {
            0% { transform: translateY(-6%) scaleX(0.8); opacity: 0.35; }
            50% { transform: translateY(6%) scaleX(1.2); opacity: 0.6; }
            100% { transform: translateY(-3%) scaleX(0.9); opacity: 0.4; }
        }

        @keyframes waveRight {
            0% { transform: translateY(6%) scaleX(1.2); opacity: 0.6; }
            50% { transform: translateY(-6%) scaleX(0.8); opacity: 0.35; }
            100% { transform: translateY(3%) scaleX(1.1); opacity: 0.6; }
        }

        /* --- АДАПТИВ ДЛЯ ТЕЛЕФОНОВ (Экраны меньше 768px) --- */
        @media (max-width: 768px) {
            .glow-side {
                width: 45px;          /* Делаем волны узкими на мобильных */
                filter: blur(28px);   /* Мягкое размытие по бокам */
                opacity: 0.45;
            }

            .glow-left {
                left: -25px;          /* Прижимаем к левому краю */
            }

            .glow-right {
                right: -25px;         /* Прижимаем к правому краю */
            }
        }

        /* --- 1. Первый экран с логотипом --- */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            z-index: 1;
        }

        .hero-logo {
            max-width: 85%;
            width: 420px;
            height: auto;
            object-fit: contain;
            margin-bottom: 40px;
        }

        /* Общий стиль для стрелочек */
        .scroll-arrow {
            position: absolute;
            width: 26px;
            height: 26px;
            opacity: 0.5;
            animation: bounce 2.2s infinite;
            z-index: 2;
        }

        /* Первая стрелочка под логотипом */
        .hero-section .scroll-arrow {
            bottom: 110px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(-8px); opacity: 0.85; }
        }

        /* --- 2. Секции с кнопками --- */
        .cards-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            padding-bottom: 40px;
        }

        .card-section {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            position: relative;
        }

        /* Прозрачная стеклянная кнопка */
        .glass-card {
            width: 100%;
            max-width: 380px;
            padding: 42px 28px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-decoration: none;
            color: #ffffff;
            text-align: center;
            display: block;
            cursor: pointer;
            will-change: transform, opacity;

            transform: scale(0.65) translateY(40px);
            opacity: 0;
            transition: transform 0.1s linear, opacity 0.1s linear, border-color 0.3s ease, background 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .card-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .btn-action {
            display: inline-block;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .glass-card:hover .btn-action {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Вторая стрелочка после первой кнопки */
        .card-section .scroll-arrow {
            bottom: 70px;
        }
    </style>
</head>
<body>

    <!-- Боковые анимированные неоновые волны -->
    <div class="glow-side glow-left"></div>
    <div class="glow-side glow-right"></div>

    <!-- Экран 1: Логотип -->
    <div class="hero-section">
        <img src="logo.png" alt="CTZCREW" class="hero-logo">
        <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4V20M12 20L6 14M12 20L18 14" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <!-- Секции с кнопками -->
    <div class="cards-container">
        
        <!-- Кнопка 1: DEEP PICTURES -->
        <div class="card-section">
            <a href="https://t.me/deep_PICTURES_color" target="_blank" class="glass-card">
                <div class="card-title">DEEP PICTURES</div>
                <div class="card-subtitle">Color Grading Channel</div>
                <div class="btn-action">Перейти в канал →</div>
            </a>
            <!-- Вторая стрелочка для показа следующей кнопки -->
            <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4V20M12 20L6 14M12 20L18 14" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- Кнопка 2: CTZCREW -->
        <div class="card-section">
            <a href="https://t.me/ctzcrew" target="_blank" class="glass-card">
                <div class="card-title">CTZCREW</div>
                <div class="card-subtitle">Official Channel</div>
                <div class="btn-action">Перейти в канал →</div>
            </a>
        </div>

    </div>

    <!-- Анимация появления кнопок при скролле -->
    <script>
        window.addEventListener('scroll', () => {
            const cards = document.querySelectorAll('.glass-card');
            const windowHeight = window.innerHeight;

            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                
                let progress = (windowHeight - rect.top) / (windowHeight * 0.65);
                progress = Math.min(Math.max(progress, 0), 1);

                const scale = 0.65 + (0.35 * progress);
                const opacity = progress;
                const translateY = (1 - progress) * 40;

                card.style.transform = `scale(${scale}) translateY(${translateY}px)`;
                card.style.opacity = opacity;
            });
        });
    </script>
</body>
</html>
